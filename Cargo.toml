[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/tianrking/LadoFlow"
authors = ["LadoFlow contributors"]

[workspace.lints.rust]
# Shared crates remain unsafe-free. Native platform adapters may opt in at the
# smallest module boundary because Win32/driver FFI cannot be expressed without
# audited unsafe calls.
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
