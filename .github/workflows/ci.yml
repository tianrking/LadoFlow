name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  android-display:
    name: Android display
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Test, lint, and assemble Android artifacts
        run: >-
          ./gradlew --no-daemon
          testDebugUnitTest
          lintDebug
          assembleDebug
          assembleDebugAndroidTest

      - name: Upload Android APKs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-display-debug
          if-no-files-found: error
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            apps/android/app/build/reports/lint-results-debug.*
            apps/android/app/build/reports/tests/testDebugUnitTest/**

  shared-rust:
    name: Shared Rust foundation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: >-
          cargo clippy
          -p ladoflow-protocol
          -p ladoflow-core
          -p ladoflow-transport
          -p ladoflow-media
          --all-targets -- -D warnings

      - name: Run tests
        run: >-
          cargo test
          -p ladoflow-protocol
          -p ladoflow-core
          -p ladoflow-transport
          -p ladoflow-media

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop frontend
        run: pnpm check:desktop

      - name: Run desktop Clippy
        run: cargo clippy -p ladoflow-desktop --all-targets -- -D warnings

      - name: Run desktop tests
        run: cargo test -p ladoflow-desktop
