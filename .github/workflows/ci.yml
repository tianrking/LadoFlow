name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  shared-rust:
    name: Shared Rust foundation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: >-
          cargo clippy
          -p ladoflow-protocol
          -p ladoflow-core
          -p ladoflow-transport
          -p ladoflow-media
          --all-targets -- -D warnings

      - name: Run tests
        run: >-
          cargo test
          -p ladoflow-protocol
          -p ladoflow-core
          -p ladoflow-transport
          -p ladoflow-media

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop frontend
        run: pnpm check:desktop

      - name: Run desktop Clippy
        run: cargo clippy -p ladoflow-desktop --all-targets -- -D warnings

      - name: Run desktop tests
        run: cargo test -p ladoflow-desktop

      - name: Build unsigned Windows installer
        if: runner.os == 'Windows'
        run: pnpm --filter @ladoflow/desktop tauri build --bundles nsis

      - name: Upload unsigned Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ladoflow-windows-x64-unsigned-${{ github.sha }}
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  windows-idd:
    name: Windows indirect display driver
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install NuGet CLI
        uses: nuget/setup-nuget@v2
        with:
          nuget-version: '7.x'

      - name: Build and validate development driver
        shell: pwsh
        run: .\platform\windows\idd\build.ps1

      - name: Upload development driver package
        uses: actions/upload-artifact@v4
        with:
          name: ladoflow-windows-idd-x64-development-${{ github.sha }}
          path: platform/windows/idd/dist/Release/x64/**
          if-no-files-found: error
          retention-days: 14
