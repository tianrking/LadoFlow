name: Bug report
description: Report reproducible LadoFlow behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: LadoFlow is pre-alpha. Please separate implemented behavior from feature requests.
  - type: input
    id: commit
    attributes:
      label: Version or commit
      placeholder: Commit SHA or release version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Host OS, display device, connection, GPU, and relevant versions.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and observed result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or measurements
      description: Remove personal content, device identifiers, credentials, and signing material.

