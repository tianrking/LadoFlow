name: Feature proposal
description: Propose a focused capability or platform change
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What real workflow is blocked today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
    validations:
      required: true
  - type: textarea
    id: platforms
    attributes:
      label: Platforms and hardware
      description: Name the host, display device, and connection type.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: How should this be validated?

